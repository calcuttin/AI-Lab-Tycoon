name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 9 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
